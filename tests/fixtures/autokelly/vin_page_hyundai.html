<!doctype html>
<html><body>
<!-- trimmed: region around the catalog iframe -->
<div class="filtry">
            <form class="col-xs-12 input-group VinDecoderForm" id="vinDecoder2Form" name="vinDecoder2Form"
                  data-ng-submit="decode()" novalidate>
                <label class="input-group-addon vinLabel" for="vin">VIN</label>
                <input type="text" id="vininput" name="vininput"
                        data-ng-model="vin" class="form-control" placeholder="Napište sem"
                        required
                        data-ng-pattern="/^([a-z,A-Z,0-9]{17})$/"
                        
                        data-ng-class="{'ErrorField' : vinDecoder2Form.vin.$invalid && (vinDecoder2Form.vin.$dirty || formSubmitted)}"
                        data-toggle="tooltip" data-placement="bottom" data-original-title="{{vinCreditData.VinCreditMessage}}">
                <span class="input-group-btn">
                    <button type="submit" class="btn btn-default btn-group-icon"
                            title="Zpracovat"
                            
                            >
                        <span class="glyphicons icon-search" rel="nofollow"><i></i></span>
                    </button>
                </span>
                <span class="ErrorMessage" ng-show="vinDecoder2Form.vin.$invalid && (vinDecoder2Form.vin.$dirty || formSubmitted)">VIN k&#243;d nem&#225; spr&#225;vnou d&#233;lku. Mus&#237; obsahovat 17 znaků.</span>
            </form>
        </div>
    </div>
</div>

    <div id="iframeHolder" style="position: relative;" data-ng-controller="akGraphicCatalogController">
        <div class="ProductTabTitle" data-ng-show="vin && vin.length > 0" style="margin-bottom: 10px;">
                <span>Hledan&#233; VIN: </span><span data-ng-bind="vin"></span>
        </div>
        

        
        <iframe style="border: 0px;" id="laximoFrame" src="https://vinsearch.autokelly.cz/cs/search/vin/TESTVINHYUNDAI001?domain=https://www.autokelly.cz&amp;blank=0&amp;cc=AK_CZ&amp;cn=9999999&amp;searchurl=https%3a%2f%2fwww.autokelly.cz%2fsearch%2foem%2f11111111-2222-3333-4444-555555555555%2f_OEM_" width="100%" height="800" onload="hideLaximoLoader()"></iframe>
</body></html>
