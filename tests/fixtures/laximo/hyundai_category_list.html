<script src="/js/jquery-ui-1.14.0.custom/jquery-ui.min.js" ></script>


<script>

    function showFilterDialog() {
        $( '#filterForm' ).dialog({
            resizable: false,
            minWidth: 700,
            position: { my: 'middle 100'},
            modal: true,
            draggable: false,
            buttons: {
                'Cancel': function() {
                    $( this ).dialog( 'close' );
                },
                'Continue': function() {
                    $('#filterForm form').submit();
                }
            }
        });
    }

    // handle filter click
    function setupFilters() {
        console.log('setupFilters');
        $('body').on('click', '.filter', function() {
            console.log('filter click');
            var url = $(this).attr('data-filter-href');
            console.log(url);

            $('#filterFormLoader').show();
            $('#filterFormContent').html('');
            showFilterDialog();

            $('#filterFormContent').load(url, function () {
                $('#filterFormLoader').hide();
                $('#filterForm form').on('submit', function (e) {
                    e.preventDefault();

                    let url = new URL('\/cs\/catalog\/category\u002Dunit\u002Dlist\u003Fsession\u003D0000000000001', window.location.href);
                    const regex = /^formValue\[(.*)\]$/;
                    const formData = new FormData(e.target);
                    let newFormData = new FormData();

                    // prepare newFormData
                    let formValue = [];
                    for (const pair of formData.entries()) {
                        const found = pair[0].match(regex);
                        if (Array.isArray(found) && found.length === 2) {
                            formValue.push({
                                'name': found[1],
                                'value': pair[1]
                            });
                        } else {
                            newFormData.set(pair[0], pair[1]);
                        }
                    }
                    newFormData.set('formValue', JSON.stringify(formValue));

                    $('#itemsContent').html('');
                    $('#itemsContentLoader').show();
                    $('#filterForm').dialog('close');

                    // request data
                    $.ajax({
                        url: url,
                        method: 'POST',
                        data: newFormData,
                        processData: false,
                        contentType: false,
                        success: function (response) {
                            $('#itemsContentLoader').hide();
                            $('#itemsContent').html(response);
                            setupFilters();
                        },
                        error: function (xhr, status, error) {
                            console.error(error);
                        }
                    });

                });
            });
            return false;
        });
    }

    $(document).ready(function () {
        setupFilters();
    });

</script>
